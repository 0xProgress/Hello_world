name: Validate Posts & Build

on:
  push:
    paths:
      - "content/posts/**"

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate frontmatter and build site
        id: build
        run: npm run build 2>&1 | tee build.log

      - name: Comment on commit if validation or build fails
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.existsSync('build.log')
              ? fs.readFileSync('build.log', 'utf8').slice(-3500)
              : 'Build or frontmatter validation failed.';
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: [
                '### ❌ Post Frontmatter / Build Validation Failed',
                '',
                'A push to `content/posts/**` failed frontmatter validation or `npm run build`:',
                '',
                '```text',
                log,
                '```',
              ].join('\n'),
            });

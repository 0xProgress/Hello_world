name: Update Lifetime Commit Count

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-count:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch total commit count from GitHub Search API
        id: fetch_commits
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          RESPONSE=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.cloak-preview+json" \
            "https://api.github.com/search/commits?q=author:0xProgress&per_page=1")

          TOTAL_COMMITS=$(echo "$RESPONSE" | jq -r '.total_count')

          if [ "$TOTAL_COMMITS" = "null" ] || [ -z "$TOTAL_COMMITS" ]; then
            echo "Error: Could not fetch commit count. Response:"
            echo "$RESPONSE"
            exit 1
          fi

          echo "TOTAL_COMMITS=$TOTAL_COMMITS" >> $GITHUB_ENV
          echo "Successfully fetched total commit count: $TOTAL_COMMITS"

      - name: Update commit-count.json file
        run: |
          echo "{\"total\": $TOTAL_COMMITS}" > commit-count.json
          cat commit-count.json

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update lifetime commit count'
          file_pattern: 'commit-count.json'
name: Validate Build & SEO

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-seo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build & validate JSON-LD, OG tags & links
        run: npm run check:seo
